name: Host review video for Buffer (media hosting only)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/host-player-mind-video.yml"
permissions:
  contents: write
  actions: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download explicitly approved Fallout 4 lesson
        uses: actions/download-artifact@v4
        with:
          name: player-mind-review-1080p
          run-id: 39014168484
          github-token: ${{ github.token }}
          path: media
      - name: Install FFmpeg verification utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify MP4 format
        run: |
          test -s media/the_player_mind_review.mp4
          python - <<'PY'
          import subprocess,json
          p="media/the_player_mind_review.mp4"
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,width,height","-of","json",p]))
          assert 98<float(d["format"]["duration"])<103
          assert any(x.get("width")==1080 and x.get("height")==1920 for x in d["streams"])
          assert any(x.get("codec_type")=="audio" for x in d["streams"])
          print("Verified MP4: ~100 sec, 1080x1920, with audio.")
          PY
      - name: Create persistent public media download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view the-player-mind-fallout4-rpg-choices-v1 >/dev/null 2>&1; then
            gh release create the-player-mind-fallout4-rpg-choices-v1 \
              media/the_player_mind_review.mp4 \
              --title "The Player Mind — Why RPG Choices Feel So Personal" \
              --notes "User-approved 100-second Fallout 4 gameplay psychology short, made for TikTok, Instagram Reels and YouTube Shorts."
          fi
          gh release view the-player-mind-fallout4-rpg-choices-v1 --json assets,url
          curl -fsSL -r 0-1023 -o /dev/null -w "ASSET HTTP %{http_code}\n" \
            "https://github.com/$(echo "$GITHUB_REPOSITORY")/releases/download/the-player-mind-fallout4-rpg-choices-v1/the_player_mind_review.mp4"
# Intentionally no scheduling or social publishing.
