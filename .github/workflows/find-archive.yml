name: Find archive HD Skyrim footage (no publishing)
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/find_archive.py"
      - ".github/workflows/find-archive.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/find_archive.py
