name: Discover alternate HD Subnautica recordings
on:
  push:
    paths:
      - scripts/discover_subnautica.py
      - .github/workflows/discover-subnautica.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python scripts/discover_subnautica.py
