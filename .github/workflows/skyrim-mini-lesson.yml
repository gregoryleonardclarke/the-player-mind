name: Render Skyrim psychology mini-lesson (PREVIEW ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/skyrim-mini-lesson.yml"
      - "scripts/render_skyrim_lesson.py"
permissions:
  contents: read
jobs:
  render:
    name: 118-second Skyrim psychology preview (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet pillow numpy scipy
      - name: Render using 2 verified Full HD Skyrim gameplay originals
        run: python scripts/render_skyrim_lesson.py
      - name: Upload MP4 for manual review only
        uses: actions/upload-artifact@v4
        with:
          name: the-player-mind-skyrim-118s-preview
          path: |
            output/skyrim_potion_psychology_mini_lesson.mp4
            output/mini_lesson_preview.png
          retention-days: 14
          if-no-files-found: error
